# /etc/rsyslog.conf on the Proxmox hosts, installed by hand:
# the hosts aren't managed by Ansible. Sends the host's journal to the cluster's syslog relay
# (iac-k8s apps/base/rsyslog, rsyslog.hirednoobs.com) over TCP, each entry with its journal
# fields as JSON, which the cluster's Vector maps as it does the prx-999 VMs' journals (iac-k8s
# apps/base/vector/config/syslog.yaml, journald.yaml): sshd, sudo, the units, ... Replaces
# Debian's rsyslog.conf, which writes /var/log/syslog and others: nothing is written locally,
# the journal stays the host's log.
#
# Install (as root), then check the host's lines arrive in VictoriaLogs (host.hostname:<host>):
#   ssh root@<host> apt install -y rsyslog
#   scp proxmox/rsyslog.conf root@<host>:/etc/rsyslog.conf   (from a checkout of this repo)
#   ssh root@<host> 'rsyslogd -N1 && systemctl restart rsyslog'
# After a change: the same scp, rsyslogd -N1 and restart. When an rsyslog upgrade changes
# Debian's own rsyslog.conf, apt asks which to keep: keep this one. Plain TCP on the server
# network for now; TLS would need rsyslog-openssl and a TLS listener on the relay. A restart of
# the relay can lose up to one line per host (plain TCP syslog's gap; RELP would close it).

global(
  workDirectory="/var/spool/rsyslog"
  # An entry's fields as JSON are longer than syslog's usual 8k (the relay allows the same).
  maxMessageSize="64k"
)

# The journal, from where it left off (the state file, in workDirectory); on the first start
# from now rather than all of it. At most 20000 entries a minute, rsyslog logs how many it
# dropped beyond that.
module(
  load="imjournal"
  StateFile="imjournal.state"
  IgnorePreviousMessages="on"
  Ratelimit.Interval="60"
  Ratelimit.Burst="20000"
)

# RFC 5424 with the app name journal, the message all of the entry's fields as JSON (MESSAGE,
# PRIORITY, _PID, _SYSTEMD_UNIT, SYSLOG_IDENTIFIER, ...), the timestamp the entry's own (UTC).
template(name="JournalJson" type="list") {
  constant(value="<")
  property(name="pri")
  constant(value=">1 ")
  property(name="timereported" dateFormat="rfc3339" date.inUTC="on")
  constant(value=" ")
  property(name="hostname")
  constant(value=" journal - - - ")
  property(name="$!all-json")
  constant(value="\n")
}

# Everything to the relay. While it's unreachable, queued in memory and then on disk (up to
# 256 MiB, in workDirectory), kept over a restart, and sent in order once it's back.
action(
  type="omfwd"
  target="rsyslog.hirednoobs.com"
  port="514"
  protocol="tcp"
  template="JournalJson"
  action.resumeRetryCount="-1"
  action.resumeInterval="10"
  queue.type="LinkedList"
  queue.size="100000"
  queue.filename="relay"
  queue.maxDiskSpace="256m"
  queue.saveOnShutdown="on"
)

# kube-apiserver's audit policy (KubeAuditPolicyConfig, control planes only). Talos writes the log
# to /var/log/audit/kube/kube-apiserver.log (100 MB per file, 10 kept, 30 days); iac-k8s'
# kube-audit collector ships it to VictoriaLogs.
#
# The first matching rule decides an event's level. Talos' default (Metadata for everything) is
# mostly the controllers' own reads and heartbeats, so those go first, at None. Everything else
# is kept at Metadata (who did what to which object, and the response code), never with
# Secret or ConfigMap bodies. Bodies (Request) only for RBAC changes and for pods created
# directly by a person or an unexpected service account: enough to see what a role grants or
# what a pod mounts.
apiVersion: audit.k8s.io/v1
kind: Policy
# Every request is also logged when it arrives (RequestReceived), which only duplicates the
# ResponseComplete event.
omitStages:
  - RequestReceived
rules:
  # Health checks, discovery and metrics: constant, and nothing in them.
  - level: None
    nonResourceURLs:
      - /healthz*
      - /livez*
      - /readyz*
      - /version
      - /openapi*
      - /metrics
      - /api
      - /api/*
      - /apis
      - /apis/*
  # The control plane talking to itself.
  - level: None
    users:
      - system:apiserver
      - system:kube-controller-manager
      - system:kube-scheduler
      - system:kube-proxy
  # Leader election and node heartbeats.
  - level: None
    resources:
      - group: coordination.k8s.io
        resources: ["leases"]
  - level: None
    resources:
      - group: ""
        resources: ["events"]
      - group: events.k8s.io
        resources: ["events"]
  # Kubelets reading what they run and reporting node and pod status.
  - level: None
    userGroups: ["system:nodes"]
    verbs: ["get", "list", "watch"]
  - level: None
    userGroups: ["system:nodes"]
    verbs: ["update", "patch"]
    resources:
      - group: ""
        resources: ["nodes/status", "pods/status"]
  # Reads by the controllers that are deployed from git: their informers list and watch all
  # day. Their writes are still logged, and reads by anything not listed here (a person, an
  # app's service account) are what the Secret-read detection looks for.
  - level: None
    verbs: ["get", "list", "watch"]
    userGroups:
      - system:serviceaccounts:flux-system
      - system:serviceaccounts:kube-system
      - system:serviceaccounts:cert-manager
      - system:serviceaccounts:external-secrets
      - system:serviceaccounts:envoy-gateway
      - system:serviceaccounts:kube-vip
      - system:serviceaccounts:kubelet-serving-cert-approver
      - system:serviceaccounts:longhorn-system
      - system:serviceaccounts:metrics-server
      - system:serviceaccounts:rabbitmq-system
      - system:serviceaccounts:reloader
      - system:serviceaccounts:monitoring
      - system:serviceaccounts:vlagent
  # Never a Secret's or ConfigMap's contents, and token requests and reviews carry tokens.
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets", "configmaps", "serviceaccounts/token"]
      - group: authentication.k8s.io
        resources: ["tokenreviews"]
  # What a role grants and whom a binding gives it to.
  - level: Request
    verbs: ["create", "update", "patch", "delete", "deletecollection"]
    resources:
      - group: rbac.authorization.k8s.io
  # Pods made by the workload controllers (Deployments, DaemonSets, Jobs, all kube-system
  # service accounts) are only recorded at Metadata; one made any other way keeps its spec.
  - level: Metadata
    userGroups: ["system:serviceaccounts:kube-system"]
    verbs: ["create"]
    resources:
      - group: ""
        resources: ["pods"]
  - level: Request
    verbs: ["create"]
    resources:
      - group: ""
        resources: ["pods"]
  - level: Metadata

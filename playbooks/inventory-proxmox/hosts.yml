# The Proxmox hosts, for ./build.sh proxmox only: outside inventory/, so the plays for every host
# never reach the hypervisors. As root, with the build machine's SSH key.
proxmox:
  hosts:
    prx-001: { ansible_host: 192.168.111.2 }
    prx-002: { ansible_host: 192.168.111.3 }
    prx-003: { ansible_host: 192.168.111.4 }
    prx-999: { ansible_host: 192.168.111.9 }
  vars:
    ansible_user: root

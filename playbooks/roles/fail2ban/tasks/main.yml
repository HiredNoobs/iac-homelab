# The sshd jail reads the journal, which needs python3-systemd.
- name: Install fail2ban
  apt:
    name:
      - fail2ban
      - python3-systemd
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Deploy SSH jail
  copy:
    src: jail.d/sshd.conf
    dest: /etc/fail2ban/jail.d/sshd.conf
    mode: '0644'
  notify: restart fail2ban

- name: Enable fail2ban
  service:
    name: fail2ban
    state: started
    enabled: yes

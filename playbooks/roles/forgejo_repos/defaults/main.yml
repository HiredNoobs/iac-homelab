# Forgejo's API on the git VM, only reachable there (nginx proxies the public name).
forgejo_repos_api: "http://127.0.0.1:{{ forgejo_http_port | default(3000) }}/api/v1"

# An admin's access token (write:repository, read:user), created in the UI.
forgejo_repos_token_file: "{{ bootstrap_secrets_dir }}/forgejo-api-token"
# A GitHub fine-grained token for the repos below: Contents read/write (the push mirror),
# Metadata, Issues and Pull requests read (the import).
forgejo_repos_github_token_file: "{{ bootstrap_secrets_dir }}/github-mirror-token"

forgejo_repos_owner: "{{ admin_user | default('hirednoobs') }}"

# Forgejo is the upstream, every push is mirrored to the GitHub repo (owner/name). protection: the
# default branch's settings (the API's branch protection fields) on top of no force pushes or
# deletion, kept as set here.
forgejo_repos:
  - name: iac-homelab
    github: HiredNoobs/iac-homelab
    # Changes go through pull requests: the clusters workflow plans them, merging applies them.
    # Lint must pass first (a status on the branch's head commit, from its push), and only the
    # owner merges (Vault only gives the apply its credentials for the owner's merges anyway).
    protection:
      enable_push: false
      enable_status_check: true
      status_check_contexts: ["Lint / lint (push)"]
      enable_merge_whitelist: true
      merge_whitelist_usernames: ["{{ forgejo_repos_owner }}"]
  - name: iac-k8s
    github: HiredNoobs/iac-k8s

# Re-creates the push mirrors with the current GitHub token, after rotating it.
forgejo_repos_update_mirror_credentials: false

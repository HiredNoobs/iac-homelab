# The IaC repos (Forgejo upstream, push-mirrored to GitHub), through Forgejo's API. Only creates
# what's missing, changes made in the UI afterwards are kept.
- name: Read API tokens
  set_fact:
    forgejo_repos_headers:
      Authorization: "token {{ lookup('file', forgejo_repos_token_file) }}"
    forgejo_repos_github_token: "{{ lookup('file', forgejo_repos_github_token_file) }}"
  no_log: "{{ not (show_secrets | bool) }}"

- name: Check for the repos
  uri:
    url: "{{ forgejo_repos_api }}/repos/{{ forgejo_repos_owner }}/{{ item.name }}"
    headers: "{{ forgejo_repos_headers }}"
    status_code: [200, 404]
  loop: "{{ forgejo_repos }}"
  loop_control:
    label: "{{ item.name }}"
  register: forgejo_repos_checks
  no_log: "{{ not (show_secrets | bool) }}"

# A one-off import, not a mirror: Forgejo is the upstream from here on.
- name: Import the repos from GitHub
  uri:
    url: "{{ forgejo_repos_api }}/repos/migrate"
    method: POST
    headers: "{{ forgejo_repos_headers }}"
    body_format: json
    body:
      clone_addr: "https://github.com/{{ item.item.github }}.git"
      service: github
      auth_token: "{{ forgejo_repos_github_token }}"
      repo_owner: "{{ forgejo_repos_owner }}"
      repo_name: "{{ item.item.name }}"
      mirror: false
      private: true
      issues: true
      labels: true
      milestones: true
      releases: true
      pull_requests: true
      wiki: true
    status_code: 201
    timeout: 600
  loop: "{{ forgejo_repos_checks.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.status == 404
  changed_when: true
  no_log: "{{ not (show_secrets | bool) }}"

- name: List push mirrors
  uri:
    url: "{{ forgejo_repos_api }}/repos/{{ forgejo_repos_owner }}/{{ item.name }}/push_mirrors"
    headers: "{{ forgejo_repos_headers }}"
  loop: "{{ forgejo_repos }}"
  loop_control:
    label: "{{ item.name }}"
  register: forgejo_repos_mirrors
  no_log: "{{ not (show_secrets | bool) }}"

# The API can't change a mirror's credentials, so it's removed and re-created below.
- name: Remove push mirrors for new credentials
  uri:
    url: "{{ forgejo_repos_api }}/repos/{{ forgejo_repos_owner }}/{{ item.0.item.name }}/push_mirrors/{{ item.1.remote_name }}"
    method: DELETE
    headers: "{{ forgejo_repos_headers }}"
    status_code: 204
  loop: "{{ forgejo_repos_mirrors.results | subelements('json') }}"
  loop_control:
    label: "{{ item.0.item.name }} {{ item.1.remote_name }}"
  when:
    - forgejo_repos_update_mirror_credentials | bool
    - item.1.remote_address == 'https://github.com/' ~ item.0.item.github ~ '.git'
  changed_when: true
  no_log: "{{ not (show_secrets | bool) }}"

# Pushed on every push (sync_on_commit), the interval catches anything that was missed.
- name: Create push mirrors
  uri:
    url: "{{ forgejo_repos_api }}/repos/{{ forgejo_repos_owner }}/{{ item.item.name }}/push_mirrors"
    method: POST
    headers: "{{ forgejo_repos_headers }}"
    body_format: json
    body:
      remote_address: "https://github.com/{{ item.item.github }}.git"
      remote_username: x-access-token
      remote_password: "{{ forgejo_repos_github_token }}"
      interval: 8h0m0s
      sync_on_commit: true
    status_code: [200, 201]
  loop: "{{ forgejo_repos_mirrors.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: >-
    forgejo_repos_update_mirror_credentials | bool
    or item.json | selectattr('remote_address', 'equalto', 'https://github.com/' ~ item.item.github ~ '.git') | list | length == 0
  changed_when: true
  no_log: "{{ not (show_secrets | bool) }}"

# No force pushes or deletion. Direct pushes are still allowed, required checks come with CI
# applying Terraform.
- name: Check branch protection
  uri:
    url: "{{ forgejo_repos_api }}/repos/{{ forgejo_repos_owner }}/{{ item.name }}/branch_protections/{{ item.branch | default('master') }}"
    headers: "{{ forgejo_repos_headers }}"
    status_code: [200, 404]
  loop: "{{ forgejo_repos }}"
  loop_control:
    label: "{{ item.name }}"
  register: forgejo_repos_protections
  no_log: "{{ not (show_secrets | bool) }}"

- name: Protect the default branch
  uri:
    url: "{{ forgejo_repos_api }}/repos/{{ forgejo_repos_owner }}/{{ item.item.name }}/branch_protections"
    method: POST
    headers: "{{ forgejo_repos_headers }}"
    body_format: json
    body:
      rule_name: "{{ item.item.branch | default('master') }}"
      enable_push: true
    status_code: 201
  loop: "{{ forgejo_repos_protections.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.status == 404
  changed_when: true
  no_log: "{{ not (show_secrets | bool) }}"

# Sends the VM's journal (sshd, sudo, Vault's audit log, Forgejo, ...) to the cluster's Vector,
# for the security detections in iac-k8s (rules/journald.yml). This Vector only reads and
# forwards (templates/vector.yaml.j2): the mapping to ECS fields lives in the cluster. It keeps
# its place in the journal and queues on disk while the cluster is unreachable.
- name: Download Vector
  get_url:
    url: "https://github.com/vectordotdev/vector/releases/download/v{{ vector_version }}/vector_{{ vector_version }}-1_amd64.deb"
    dest: "/var/cache/vector_{{ vector_version }}-1_amd64.deb"
    checksum: "sha256:{{ vector_sha256 }}"
    mode: '0644'

- name: Install Vector
  apt:
    deb: "/var/cache/vector_{{ vector_version }}-1_amd64.deb"
  notify: restart vector

# The package adds its user to adm (all of /var/log) as well as systemd-journal; the journal is
# all it reads.
- name: Let Vector read the journal, and nothing else
  user:
    name: vector
    groups: systemd-journal
    append: no
  notify: restart vector

# It runs journalctl and sends over HTTPS: no capabilities (the package's unit gives it
# CAP_NET_BIND_SERVICE), a read-only system, its own writable state directory.
- name: Ensure Vector's drop-in directory exists
  file:
    path: /etc/systemd/system/vector.service.d
    state: directory
    mode: '0755'

- name: Harden Vector's service
  copy:
    dest: /etc/systemd/system/vector.service.d/hardening.conf
    mode: '0644'
    content: |
      # Managed by Ansible.
      [Service]
      AmbientCapabilities=
      CapabilityBoundingSet=
      NoNewPrivileges=yes
      ProtectSystem=strict
      ProtectHome=yes
      PrivateTmp=yes
      PrivateDevices=yes
      ProtectKernelTunables=yes
      ProtectKernelModules=yes
      ProtectControlGroups=yes
      RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
      RestrictNamespaces=yes
      LockPersonality=yes
      StateDirectory=vector
  notify: restart vector

- name: Configure Vector
  template:
    src: vector.yaml.j2
    dest: /etc/vector/vector.yaml
    mode: '0644'
    validate: /usr/bin/vector validate --no-environment %s
  notify: restart vector

- name: Enable Vector
  systemd:
    name: vector
    enabled: yes
    state: started
    daemon_reload: yes

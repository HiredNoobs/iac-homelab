- name: Ensure node_exporter user exists
  user:
    name: "{{ node_exporter_user }}"
    shell: /usr/sbin/nologin
    system: yes
    create_home: no

- name: Get installed node_exporter version
  command: "{{ node_exporter_install_dir }}/node_exporter --version"
  register: node_exporter_installed
  changed_when: false
  failed_when: false

# In a new private directory on disk (/tmp is a tmpfs), removed afterwards.
- block:
    - name: Create a download directory
      tempfile:
        state: directory
        path: /var/tmp
        prefix: node_exporter-
      register: node_exporter_download

    - name: Download node_exporter archive
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        checksum: "sha256:{{ node_exporter_sha256 }}"
        dest: "{{ node_exporter_download.path }}/node_exporter.tar.gz"
        mode: "0644"

    - name: Extract node_exporter
      unarchive:
        src: "{{ node_exporter_download.path }}/node_exporter.tar.gz"
        dest: "{{ node_exporter_download.path }}"
        remote_src: yes

    - name: Install node_exporter binary
      copy:
        src: "{{ node_exporter_download.path }}/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: "{{ node_exporter_install_dir }}/node_exporter"
        mode: "0755"
        owner: root
        group: root
        remote_src: yes
      notify: restart node_exporter
  always:
    - name: Remove the download directory
      file:
        path: "{{ node_exporter_download.path }}"
        state: absent
      when: node_exporter_download.path is defined
  when: ("version " ~ node_exporter_version ~ " ") not in node_exporter_installed.stdout

- name: Create systemd service for node_exporter
  copy:
    dest: "{{ node_exporter_service }}"
    mode: "0644"
    content: |
      [Unit]
      Description=Prometheus Node Exporter
      Wants=network-online.target
      After=network-online.target

      [Service]
      User={{ node_exporter_user }}
      Group={{ node_exporter_user }}
      Type=simple
      ExecStart={{ node_exporter_install_dir }}/node_exporter \
        --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|run)($|/) \
        --collector.systemd \
        --collector.processes
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
  notify:
    - reload systemd
    - restart node_exporter

- name: Enable node_exporter
  systemd:
    name: node_exporter
    enabled: yes
    state: started

# Bump both together, the checksum is the linux_amd64 zip's from the release's
# vault_<version>_SHA256SUMS (check its .sig against HashiCorp's key). Keep the version the
# data was last used with when restoring a snapshot, upgrade afterwards.
# renovate: datasource=github-releases depName=hashicorp/vault extractVersion=^v(?<version>.+)$
vault_version: "2.1.2"
vault_sha256: "873bbdac35ca4b0c3e2886c41991ca1272fc452826208d5499f32d12cd2e76e1"

# The name clients use, also the certbot certificate's name. Vault listens on 443 so
# VAULT_ADDR=https://vault.<domain> (tools-bin) works without a port.
vault_domain: "vault.{{ domain }}"
vault_port: 443
vault_cluster_port: 8201

vault_user: vault
vault_install_dir: /usr/local/bin
vault_config_dir: /etc/vault.d
vault_data_dir: /var/lib/vault/data

# For the vault CLI on the VM, before and after DNS points at it.
vault_cli_addr: "https://127.0.0.1:{{ vault_port }}"

# Sends the VM's journal to VictoriaLogs (sshd, sudo, Vault's audit log, Forgejo, ...), for the
# security detections in iac-k8s (rules/journald.yml). systemd-journal-upload keeps its place
# in the journal (/var/lib/systemd/journal-upload/state), so it carries on where it stopped after
# a restart or while VictoriaLogs was unreachable. The first start sends the journal from its
# beginning; VictoriaLogs drops what's older than its retention.
- name: Install systemd-journal-upload
  apt:
    name: systemd-journal-remote
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Ensure the config drop-in directory exists
  file:
    path: /etc/systemd/journal-upload.conf.d
    state: directory
    mode: '0755'

# The Gateway's certificate is Let's Encrypt's, checked against the system's CAs. No client
# certificate ("-"): the Gateway lets these VMs in by address instead.
- name: Configure systemd-journal-upload
  copy:
    dest: /etc/systemd/journal-upload.conf.d/victorialogs.conf
    mode: '0644'
    content: |
      # Managed by Ansible.
      [Upload]
      URL={{ journal_upload_url }}
      ServerKeyFile=-
      ServerCertificateFile=-
      TrustedCertificateFile=/etc/ssl/certs/ca-certificates.crt
  notify: restart systemd-journal-upload

- name: Enable systemd-journal-upload
  systemd:
    name: systemd-journal-upload
    enabled: yes
    state: started

# A new secret ID for the AppRole, then every other one is destroyed: there's only ever the one on
# the VM. Vault's API from the controller, with the root token (VaultRootTokenUsed and
# VaultConfigChange alert on this, as they should).

- name: Read the AppRole's role ID
  uri:
    url: "{{ vault_backup_vault_url }}/role-id"
    headers:
      X-Vault-Token: "{{ vault_backup_root_token }}"
    status_code: [200, 400, 404]
  delegate_to: localhost
  become: false
  register: vault_backup_role_id
  no_log: "{{ not (show_secrets | bool) }}"

- name: The AppRole doesn't exist yet
  debug:
    msg: >-
      Vault has no AppRole {{ vault_backup_approle }}, so the backup has no secret ID and fails
      until it does: apply terraform/vault (build.sh vault) and run backups.yml again.
  when: vault_backup_role_id.status != 200

- when: vault_backup_role_id.status == 200
  block:
    - name: Create a secret ID
      uri:
        url: "{{ vault_backup_vault_url }}/secret-id"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_backup_root_token }}"
        body_format: json
        body: {}
      delegate_to: localhost
      become: false
      register: vault_backup_secret_id
      changed_when: true
      no_log: "{{ not (show_secrets | bool) }}"

    # No trailing newline, the script reads them with the vault CLI's @file.
    - name: Deploy the AppRole credentials
      copy:
        dest: "{{ vault_backup_config_dir }}/{{ item.name }}"
        owner: root
        group: "{{ vault_backup_user }}"
        mode: '0640'
        content: "{{ item.value }}"
      loop:
        - { name: role-id, value: "{{ vault_backup_role_id.json.data.role_id }}" }
        - { name: secret-id, value: "{{ vault_backup_secret_id.json.data.secret_id }}" }
      loop_control:
        label: "{{ item.name }}"
      no_log: "{{ not (show_secrets | bool) }}"

    # 404 when there are none.
    - name: List the secret IDs
      uri:
        url: "{{ vault_backup_vault_url }}/secret-id?list=true"
        headers:
          X-Vault-Token: "{{ vault_backup_root_token }}"
        status_code: [200, 404]
      delegate_to: localhost
      become: false
      register: vault_backup_accessors
      no_log: "{{ not (show_secrets | bool) }}"

    - name: Destroy the older secret IDs
      uri:
        url: "{{ vault_backup_vault_url }}/secret-id-accessor/destroy"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_backup_root_token }}"
        body_format: json
        body:
          secret_id_accessor: "{{ item }}"
        status_code: [204]
      changed_when: true
      delegate_to: localhost
      become: false
      loop: >-
        {{ (vault_backup_accessors.json.data['keys'] if vault_backup_accessors.status == 200 else [])
           | difference([vault_backup_secret_id.json.data.secret_id_accessor]) }}
      no_log: "{{ not (show_secrets | bool) }}"

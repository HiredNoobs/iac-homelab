# Each host gets its own keypair. Only the mgmt hosts' keys are authorized on the other
# hosts, so mgmt can jump anywhere but a compromised VM can't reach mgmt, which holds credentials.
- name: Generate SSH keypair
  user:
    name: "{{ movein_username }}"
    generate_ssh_key: yes
    ssh_key_type: ed25519
    ssh_key_file: ".ssh/id_ed25519"
  register: movein_ssh_key

- name: Authorize mgmt keys
  authorized_key:
    user: "{{ movein_username }}"
    key: "{{ hostvars[item].movein_ssh_key.ssh_public_key }}"
    state: present
  loop: "{{ ansible_play_hosts | intersect(groups['mgmt'] | default([])) }}"
  when: item != inventory_hostname

# Key only, Ansible connects as movein_username with the key cloud-init authorized.
- name: Harden sshd
  copy:
    src: sshd_config.d/10-hardening.conf
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
  notify: reload sshd

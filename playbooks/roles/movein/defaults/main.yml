movein_username: "{{ admin_user | default('hirednoobs') }}"

# Commit of tools-bin to check out after movein.sh has cloned it, movein.sh is fetched at the
# same commit. A SHA so a push to tools-bin can't change the VMs, bump it deliberately.
tools_bin_repo: https://github.com/HiredNoobs/tools-bin.git
# k8s-deployment branch, switch to a master commit once it's merged.
tools_bin_version: b63e35c93284d12f514b6fb8f7c26fffb3cfbff5

# tools-bin `setup` commands run as movein_username.
tools_bin_setup: [bash, vim, tmux]

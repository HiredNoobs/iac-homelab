[defaults]
# One file per Terraform root (terraform/<root>), Ansible merges them. build.sh limits each
# run to the root's group (clusters, gitops).
inventory = inventory/
roles_path = roles
# Run notified handlers even when a later task fails. Otherwise the notification is lost, and as
# the changed files are already in place the next run doesn't notify again (e.g. nginx keeps its
# old config).
force_handlers = True
interpreter_python = auto_silent

[ssh_connection]
# New VMs have unknown host keys, use build.sh --refresh-keys to forget the old ones after a rebuild.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
pipelining = True

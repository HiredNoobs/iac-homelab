[defaults]
inventory = inventory.generated.yml
roles_path = roles
interpreter_python = auto_silent

[ssh_connection]
# New VMs have unknown host keys, use build.sh --refresh-keys to forget the old ones after a rebuild.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
pipelining = True

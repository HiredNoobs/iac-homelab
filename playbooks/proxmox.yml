---
# node_exporter and the package versions on the Proxmox hosts, as on the VMs. Run from playbooks/
# with the hosts' own inventory: ansible-playbook -i inventory-proxmox proxmox.yml
# One host at a time: a failure stops it before the next.
- hosts: proxmox
  gather_facts: false
  serial: 1
  roles:
    - common
    - monitoring
